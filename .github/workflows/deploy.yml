name: Deploy repost-bot to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Set secrets (BOT_TOKEN, ADMIN_IDS, WEBHOOK_SECRET, RUBIKA_TOKEN)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.BOT_TOKEN }}" | npx wrangler secret put BOT_TOKEN
          echo "${{ secrets.ADMIN_IDS }}" | npx wrangler secret put ADMIN_IDS
          echo "${{ secrets.WEBHOOK_SECRET }}" | npx wrangler secret put WEBHOOK_SECRET
          if [ -n "${{ secrets.RUBIKA_TOKEN }}" ]; then
            echo "${{ secrets.RUBIKA_TOKEN }}" | npx wrangler secret put RUBIKA_TOKEN
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
