name = "repost-bot"
main = "src/index.js"
compatibility_date = "2024-09-01"

# هر ۲ دقیقه یک‌بار کانال‌های مبدا چک می‌شوند
[triggers]
crons = ["*/2 * * * *"]

# بعد از ساخت KV Namespace در داشبورد Cloudflare یا با دستور زیر،
# مقدار id را جایگزین کن:
# npx wrangler kv namespace create BOT_KV
[[kv_namespaces]]
binding = "BOT_KV"
id = "14977089594943f7be5cfd87d633da83"

# Workers AI — برای ساخت عکس هوش مصنوعی (رایگان، همون اکانت Cloudflare)
# وقتی جستجوی عکس نتیجه‌ای پیدا نکنه، از این استفاده می‌شه.
[ai]
binding = "AI"

# این‌ها به‌صورت GitHub Secrets ست می‌شوند، نه اینجا:
# BOT_TOKEN, ADMIN_IDS, WEBHOOK_SECRET, SERPER_KEY, GROQ_API_KEY
